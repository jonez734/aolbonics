[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aolbonics"
version = "0.1.0"
description = "jargon - glossary of BBS and internet slang, served through bed/zoid6"
requires-python = ">=3.9,<3.13"
license = "GPL-3.0-or-later"
authors = [
    { name = "zoidtechnologies.com", email = "jargon@projects.zoidtechnologies.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: BBS",
    "Topic :: Terminals",
]
dependencies = [
    "bed",
    # jargon imports bbsengine6.backend.objects (the manifest check), which
    # only exists in bbsengine6 builds from 2026-11 onward.
    "bbsengine6>=0.5.0.dev",
]

[project.optional-dependencies]
# The zoid6 host installs this extra: the zoid6 daemon loads jargon.api.handler, which needs zoid6.
# A plain install (any other BBS) is the bed client and needs no zoid6.
zoid6 = [
    "zoid6",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
jargon = "jargon.__main__:_main"

[project.urls]
Homepage = "https://zoidtechnologies.com/jargon/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jargon*"]
namespaces = false

[tool.setuptools.package-data]
jargon = ["sql/*.sql", "sql/objects.json"]
